name: Phone site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/sheets
          cp phone/index.html phone/class.html phone/lessons.json phone/manifest.webmanifest phone/sw.js _site/
          cp public/favicon.svg public/icon-192.png public/icon-512.png public/icon-maskable-192.png public/icon-maskable-512.png _site/
          cp -r public/sheets/. _site/sheets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
