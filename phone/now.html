<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1016" />
    <title>Ham Tech class</title>
    <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      let hamInstall;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        hamInstall = event;
        const button = document.getElementById("save");
        if (button) button.textContent = "Put this on my phone";
      });
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1016;
        --surface: #141c26;
        --fg: #e7e2d6;
        --muted: #8d948a;
        --primary: #f0b429;
        --ink: #1a1408;
        --line: #2a3544;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 40rem; margin: 0 auto; padding: 1rem 1rem 3rem; }
      a { color: var(--primary); }
      .kicker { margin: 0; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); font-size: 0.75rem; }
      h1 { margin: 0.3rem 0 0.6rem; font-size: 1.6rem; }
      .card { border: 1px solid var(--line); background: var(--surface); border-radius: 1rem; padding: 1rem; margin-top: 0.8rem; }
      li { margin: 0.55rem 0; line-height: 1.4; }
      button, .choice {
        min-height: 2.75rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #1c2733;
        color: var(--fg);
        padding: 0.4rem 1rem;
        font: inherit;
      }
      button.primary { background: var(--primary); color: var(--ink); border-color: transparent; font-weight: 700; }
      button:disabled { opacity: 0.4; }
      .choice { display: block; width: 100%; text-align: left; border-radius: 0.8rem; margin-top: 0.45rem; }
      .choice.right { background: var(--primary); color: var(--ink); }
      .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
      .muted { color: var(--muted); }
      .path button { display: block; width: 100%; text-align: left; border-radius: 0.8rem; margin-top: 0.4rem; }
    </style>
  </head>
  <body>
    <main>
      <p><button type="button" class="primary" id="save">Put this on my phone</button></p>
      <p class="muted" id="save-note"></p>
      <p><a href="./">Home</a></p>
      <p class="kicker" id="kicker">Class</p>
      <h1 id="title">Loading</h1>
      <p id="lead"></p>
      <div class="card"><ul id="points"></ul></div>
      <div class="card">
        <h2>Check</h2>
        <p id="prompt"></p>
        <div id="choices"></div>
        <p class="muted" id="why"></p>
        <div class="row">
          <button type="button" id="back">Back</button>
          <button type="button" class="primary" id="next">Next lesson</button>
        </div>
      </div>
      <p><button type="button" id="path-toggle">See the whole path</button></p>
      <div class="path" id="path" hidden></div>
    </main>
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
      document.getElementById("save").addEventListener("click", async () => {
        const note = document.getElementById("save-note");
        if (!hamInstall) {
          note.textContent = "If an old Ham Tech icon is already on the phone, hold it, tap the i or App info, then Uninstall. Open this page again and tap the gold button.";
          return;
        }
        hamInstall.prompt();
        await hamInstall.userChoice;
        hamInstall = null;
        note.textContent = "Look for Ham Tech in your app list. Hold it, then drag it onto the home screen.";
      });
      const KEY = "ham-tech-phone-class";
      let lessons = [];
      let index = 0;
      let picked = null;
      let doneThrough = -1;

      const title = document.getElementById("title");
      const lead = document.getElementById("lead");
      const points = document.getElementById("points");
      const prompt = document.getElementById("prompt");
      const choices = document.getElementById("choices");
      const why = document.getElementById("why");
      const kicker = document.getElementById("kicker");
      const next = document.getElementById("next");
      const back = document.getElementById("back");
      const path = document.getElementById("path");

      function render() {
        const lesson = lessons[index];
        const correct = picked === lesson.check.answer;
        kicker.textContent = "Lesson " + (index + 1) + " of " + lessons.length + " · " + lesson.part + " · " + lesson.minutes + " min";
        title.textContent = lesson.title;
        lead.textContent = lesson.lead;
        points.replaceChildren();
        lesson.points.forEach((point) => {
          const li = document.createElement("li");
          li.textContent = point;
          points.appendChild(li);
        });
        prompt.textContent = lesson.check.prompt;
        choices.replaceChildren();
        lesson.check.choices.forEach((choice, choiceIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice" + (picked !== null && choiceIndex === lesson.check.answer ? " right" : "");
          button.textContent = choice;
          button.addEventListener("click", () => choose(choiceIndex));
          choices.appendChild(button);
        });
        why.textContent = picked === null ? "" : lesson.check.why;
        back.disabled = index === 0;
        const last = index === lessons.length - 1;
        next.textContent = last ? "Back to the start" : "Next lesson";
        next.disabled = !correct && doneThrough <= index;
      }

      function choose(choice) {
        picked = choice;
        if (choice === lessons[index].check.answer) {
          doneThrough = Math.max(doneThrough, index + 1);
          localStorage.setItem(KEY, String(doneThrough));
        }
        render();
      }

      function go(nextIndex) {
        index = nextIndex;
        picked = null;
        render();
        window.scrollTo(0, 0);
      }

      back.addEventListener("click", () => go(index - 1));
      next.addEventListener("click", () => go(index === lessons.length - 1 ? 0 : index + 1));
      document.getElementById("path-toggle").addEventListener("click", () => {
        path.hidden = !path.hidden;
      });

      const data = [{"id":"what","title":"What ham radio is","minutes":4,"lead":"Ham radio is a way for ordinary people to talk to each other by radio, without a phone company in the middle.","points":["You use a radio you own. The other person uses a radio they own. The signal goes through the air.","It is a hobby, a skill, and a public service. People use it to chat, to experiment, and to help when phones and internet fail.","It is not your cell phone, and it is not CB. In the United States you need a license from the FCC before you transmit.","Listening is always allowed. The license is for talking."],"part":"Start here","check":{"prompt":"What is ham radio, in one sentence?","choices":["A phone plan you pay for each month","People talking to each other by radio, with a license","A kind of Wi-Fi router"],"answer":1,"why":"Ham radio is licensed two-way radio between people. No monthly plan. No phone company carrying the call."}},{"id":"who","title":"Who it is for","minutes":3,"lead":"You do not need to be an engineer. You need curiosity and a license.","points":["Some people want a radio in the car or a small handheld for the neighborhood and for storms.","Some people want to reach other countries. Some build antennas. Some help at public events.","The entry license is called Technician. It is the first step. You can stop there and still have a full, useful radio life on local airwaves.","You will not be tested on Morse code. That requirement ended years ago."],"part":"Start here","check":{"prompt":"Do you have to know Morse code to get a Technician license?","choices":["Yes, it is still required","No"],"answer":1,"why":"Morse code is a skill some hams enjoy. It is not on the test, and you do not need it to get on the air."}},{"id":"license","title":"The license, and nothing else","minutes":4,"lead":"The test is smaller than it feels when you look at the whole book.","points":["The Technician exam is 35 multiple-choice questions. You need 26 right. That is it.","A team of volunteer examiners gives the test. You do not go to a government office.","When you pass, the FCC gives you a call sign. That call sign is your name on the air.","The license lasts 10 years. The privileges you get are written down. You do not have to memorize the whole radio universe on day one."],"part":"Start here","check":{"prompt":"How many questions do you need right, out of 35?","choices":["All 35","26","18"],"answer":1,"why":"26 out of 35. You are allowed to miss 9. The book is a pool of questions. The test only uses 35 of them."}},{"id":"radio","title":"What a radio does","minutes":4,"lead":"A radio does two jobs. It sends, and it listens.","points":["When you talk, the radio turns your voice into a radio wave and lets it go.","When you listen, it catches a wave and turns it back into sound.","The same idea is in a tiny handheld and in a big radio on a desk. The size changes the reach, not the basic job.","You will hear the words transmitter, receiver, and transceiver. A transceiver is simply both jobs in one box."],"part":"Start here","check":{"prompt":"A transceiver is…","choices":["A radio that only listens","A radio that sends and listens","The license itself"],"answer":1,"why":"Transceiver means transmitter plus receiver. Most ham radios you will buy are transceivers."}},{"id":"bands","title":"Channels, without the math","minutes":4,"lead":"A frequency is a spot on the dial. A band is a neighborhood of spots.","points":["Two people who want to talk have to be on the same spot, or they will not hear each other.","Hams talk about bands by a length: 2 meters, 70 centimeters, 10 meters. The name is a nickname for that neighborhood.","2 meters and 70 centimeters are the local bands. A handheld lives there. That is where most new Technicians start.","Longer-distance bands exist. You do not need them for the first week. The book will introduce them when you are ready."],"part":"Start here","check":{"prompt":"Where does a new Technician usually start?","choices":["A handheld on the local 2 meter and 70 centimeter bands","A huge shortwave station on day one","Any frequency they feel like"],"answer":0,"why":"A small handheld on 2 meters and 70 centimeters is the normal first radio. You stay inside the places your license allows."}},{"id":"repeater","title":"The helper on the hill","minutes":4,"lead":"A handheld does not reach very far by itself. A repeater fixes that.","points":["A repeater is a radio on a tall building or a hill. It hears you and sends you back out, louder and higher.","You listen on one frequency and talk on another. The radio remembers the split. You do not do the math in your head.","Many repeaters want a quiet tone so they know you meant to use them. That tone is called CTCSS. Your radio sends it. You usually cannot hear it.","If you and the other person can hear each other without the repeater, you can move to the same frequency and leave the hilltop free. That is called simplex."],"part":"Start here","check":{"prompt":"What is a repeater for?","choices":["To make a handheld reach farther","To replace your license","To play music"],"answer":0,"why":"A repeater hears a small radio and retransmits it from up high. That is why a handheld can talk across a town."}},{"id":"first","title":"Your first time talking","minutes":4,"lead":"The first contact is short. You do not give a speech.","points":["Listen first. If someone is already talking, wait.","On a repeater, say your call sign. That is the whole introduction. Someone will answer, or they will not. Both are normal.","Speak plainly. Say your name if you want. Say where you are if you want. Then say your call sign again when you are done.","Leave a short pause between transmissions so someone else can break in."],"part":"Start here","check":{"prompt":"What do you do before you transmit?","choices":["Listen","Talk immediately so people know you are there","Send music"],"answer":0,"why":"Listen first. Then say your call sign. A call sign is enough to start."}},{"id":"rules","title":"The few rules that matter first","minutes":4,"lead":"The rule book is long. Day one only needs four ideas.","points":["Say your call sign every 10 minutes during a conversation, and again at the end.","Stay on frequencies your license allows. A Technician has a lot of local room. The HF voice slice is small. The sheets list it when you want it.","No music. No business. No hiding what you are saying. Be decent.","Use the least power that still makes the contact. A handheld at low power is often enough."],"part":"Start here","check":{"prompt":"How often do you say your call sign during a conversation?","choices":["Every 10 minutes, and at the end","Only once a year","Never, if you already said hello"],"answer":0,"why":"Every 10 minutes, and when you finish. That is how other people know who is on the air."}},{"id":"next","title":"What to study next","minutes":3,"lead":"You do not study the whole book at once. The next lessons are the words you will actually hear.","points":["If the book is open to electrical ideas and it feels like noise, use the Water, Metrics, and Ohm buttons in this app. Those are the same ideas, as pictures.","The printed sheets are a reference, not a lesson. Look at one sheet after you have met the idea. Do not start there.","A quiz is useful after a chapter, not before. Missing questions is how you find the next thing to learn. It is not a grade on you.","A good session is one lesson here, then one short chapter or one video on that same idea. Then stop."],"part":"Start here","check":{"prompt":"When is a quiz most useful?","choices":["After you have met the idea, to see what stuck","Before you know any of the words, as a surprise","Instead of ever learning the idea"],"answer":0,"why":"A quiz shows the gap. It works after a lesson. It feels cruel before one. One idea, then a few questions, then rest."}},{"id":"callsign","title":"Your call sign","minutes":4,"lead":"A call sign is your name on the radio. The FCC assigns it after you pass.","points":["It is a short mix of letters and one number, like W8ABC. The number is a region. Ohio is in region 8. Yours will not be W8ABC. That one is only an example.","You say it so other people know who is transmitting. It is not a secret code.","You use your own call sign. You do not borrow someone else's, even for a minute.","Until the call sign shows up in the FCC database, you wait. Passing the test is not the same moment as being allowed to transmit."],"part":"On the air","check":{"prompt":"Whose call sign do you say?","choices":["Yours","The repeater's","Whoever talked last"],"answer":0,"why":"You identify your own station with your own call sign. Every 10 minutes, and at the end."}},{"id":"phonetics","title":"Spelling so people hear you","minutes":4,"lead":"B, D, and E sound alike on a noisy radio. A phonetic alphabet gives each letter a word.","points":["Instead of “B” you say “Bravo.” Instead of “S” you say “Sierra.” The other person writes what they hear.","The standard list starts Alpha, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel.","You do not have to recite all 26 today. Learn why they exist, and learn the letters in your own call sign when you have one.","On a test question, the right idea is: phonetics make your call sign easier to understand. They are not a secret language."],"part":"On the air","check":{"prompt":"Why say “Alpha” instead of “A”?","choices":["So the letter is not mistaken for another letter","Because the FCC requires a code word before every sentence","So people who do not have a license cannot understand you"],"answer":0,"why":"Phonetics are for clarity. They are the opposite of a secret code. Anyone can look them up."}},{"id":"knobs","title":"The knobs that matter","minutes":4,"lead":"A handheld looks busy. Four controls do almost all of the early work.","points":["Volume is how loud the speaker is. It does not make your signal stronger.","Squelch hides the hiss when nobody is talking. Turn it up too far and you also hide weak people.","The big knob or the keypad picks the frequency. That is the spot on the dial.","A button on the side, the push-to-talk, is what actually transmits. If you are not pressing it, you are only listening."],"part":"On the air","check":{"prompt":"What does the squelch knob do?","choices":["It quiets the hiss until a signal shows up","It raises your transmit power","It changes your call sign"],"answer":0,"why":"Squelch is a mute for the noise. Too much squelch and a weak station never opens the speaker."}},{"id":"offset","title":"Offset and the quiet tone","minutes":4,"lead":"A repeater listens on one frequency and talks on another. Your radio can remember both.","points":["The difference is the offset. On 2 meters it is usually 600 kHz. On 70 centimeters it is usually 5 MHz.","You listen to the repeater's output. When you press the button, the radio jumps to the input, talks, and jumps back.","Many repeaters also want a tone, called CTCSS. You usually cannot hear it. It is how the repeater knows you meant to use it.","If the repeater is silent and you are on the right frequency, the missing piece is often the tone."],"part":"On the air","check":{"prompt":"The usual 2 meter repeater offset is…","choices":["600 kHz","5 MHz","10 meters"],"answer":0,"why":"2 meters is usually plus or minus 600 kHz. 70 centimeters is usually plus or minus 5 MHz. The radio does the jump for you."}},{"id":"calling","title":"Where people listen","minutes":3,"lead":"A few frequencies are meeting places. You call there, then you move.","points":["146.520 MHz is the 2 meter FM calling frequency. Both people use that same frequency. That is simplex.","446.000 MHz is the 70 centimeter FM calling frequency.","Say your call sign, make contact, then move to another frequency if the conversation will last. Leave the calling spot free.","A repeater is a different meeting place. It has its own pair of frequencies, published by local clubs."],"part":"On the air","check":{"prompt":"146.520 MHz is…","choices":["The 2 meter FM calling frequency","A frequency only Generals may use","The tone that opens a repeater"],"answer":0,"why":"146.520 is where 2 meter FM stations listen for a call. It is simplex: both people on the same frequency."}},{"id":"net","title":"Nets, and real emergencies","minutes":4,"lead":"Sometimes the channel has a host. That host is net control. You talk when they ask.","points":["A net is an on-air meeting, often weekly, for weather, club news, or practice.","Check in with your call sign when net control asks for check-ins. Then wait.","If there is a real emergency, the chat stops. Say “emergency,” your call sign, where you are, and what is wrong. Then listen.","Do not transmit just to hear yourself if people are already handling an emergency. Help only if you actually can."],"part":"On the air","check":{"prompt":"During a directed net, when do you talk?","choices":["When net control asks you to","Whenever you think of something","Only on Morse code"],"answer":0,"why":"Net control is the host. You check in when invited. An emergency is the exception: say so clearly, then stop and listen."}},{"id":"wave","title":"A radio wave, without the scare","minutes":4,"lead":"A radio wave is a ripple moving at the speed of light. Frequency is how fast it ripples. Wavelength is how long one ripple is.","points":["Hertz means ripples per second. A megahertz is a million of them.","The length of one ripple, in meters, is about 300 divided by the frequency in megahertz.","300 divided by 146 is about 2. That is why 146 MHz is called the 2 meter band. The name is a length.","You will practice that division later. Today, the win is knowing the name of the band is the length of the wave."],"part":"The air","check":{"prompt":"Why is 146 MHz called 2 meters?","choices":["One wave is about 2 meters long","The radio must be 2 meters from the ground","You may only talk for 2 meters of distance"],"answer":0,"why":"Wavelength in meters is about 300 ÷ megahertz. 300 ÷ 146 is about 2. The band is named for that length."}},{"id":"map","title":"Where a Technician may talk","minutes":5,"lead":"You do not get every frequency. You get a useful set, and the local ones are the generous part.","points":["6 meters, 2 meters, 1.25 meters, and 70 centimeters are yours, in almost every mode. A handheld lives on 2 meters and 70 centimeters.","Above those, the higher bands are yours too. You will not need them in the first month.","On HF, voice is only a slice of 10 meters: 28.300 to 28.500 MHz, and no more than 200 watts. Morse code has small slices on 80, 40, and 15 meters.","20 meters is not a Technician band. That one waits for General. If you are not sure a frequency is yours, do not transmit there."],"part":"The air","check":{"prompt":"Which of these is a normal first place for a Technician?","choices":["2 meters and 70 centimeters","All of 20 meters","Any frequency, if you speak politely"],"answer":0,"why":"Local VHF and UHF are the Technician's home. 20 meters is a General and Extra band. Politeness does not add frequencies."}},{"id":"four","title":"Four words, and then stop","minutes":4,"lead":"The electrical chapter is four words wearing costumes. Learn the words. Leave the triangles for the next sitting.","points":["Voltage, letter E, is the push. The unit is the volt.","Current, letter I, is the flow. The unit is the amp.","Resistance, letter R, is the squeeze. The unit is the ohm.","Power, letter P, is push times flow. The unit is the watt. The Water lab in this app is the moving picture of the first three."],"part":"Electricity, slowly","check":{"prompt":"Which word is the flow?","choices":["Current, in amps","Voltage, in volts","Resistance, in ohms"],"answer":0,"why":"Current is the flow, measured in amps, and the formula letter is I. Voltage is the push. Resistance is the squeeze."}},{"id":"paths","title":"One path, or several","minutes":4,"lead":"Parts are either in a single line, or side by side. That is series and parallel.","points":["Series means one path. The same current goes through each part. The pushes add up. The squeezes add up.","Parallel means branches. Each branch feels the same push. The flows add up. The total squeeze is less than the smallest branch.","A switch or a fuse belongs in the path, in series, because it has to be able to stop everything.","Two equal resistors side by side act like half of one of them. You do not need more cases today."],"part":"Electricity, slowly","check":{"prompt":"In a series circuit, what is true?","choices":["There is one path, and the current is the same all the way around","Every part gets a different current","The parts are side by side"],"answer":0,"why":"Series is one loop. Current is the same everywhere in that loop. Side by side is parallel."}},{"id":"acdc","title":"A battery, and the wall","minutes":3,"lead":"Some electricity stays in one direction. Some of it reverses, over and over.","points":["A battery is direct current, DC. The push keeps the same sign. Electrons drift one way.","A wall outlet and a radio wave are alternating current, AC. The push reverses. A radio wave does it millions or billions of times a second.","Frequency is how often that reversal completes a full cycle. House power in the United States is 60 Hz. A 146 MHz signal does it 146 million times a second.","The AC/DC lab in this app draws both. Use it after this lesson, not before."],"part":"Electricity, slowly","check":{"prompt":"A battery produces…","choices":["Direct current","A radio license","60 Hz house power"],"answer":0,"why":"A battery is DC, one direction. House outlets reverse 60 times a second. That reversal is AC."}},{"id":"antenna","title":"The antenna does the leaving","minutes":4,"lead":"The radio makes the signal. The antenna lets it go, and lets other signals in.","points":["A rubber duck on a handheld is convenient and a poor radiator. It is fine for learning in the neighborhood.","Height and a clear view often matter more than turning the power up.","The cable between the radio and the antenna is usually coax. It is a hose for the signal. Keep outdoor joints dry.","A wire that could fall onto a power line is in the wrong place. Look up before you put anything in the air."],"part":"The station","check":{"prompt":"What is the antenna's job?","choices":["To let the radio wave leave and arrive","To replace the license","To raise the volume of the speaker"],"answer":0,"why":"The antenna couples the radio to the air. Volume is only the speaker. The license is still required."}},{"id":"safe","title":"The dangers that are real","minutes":4,"lead":"The test has a safety section because a few mistakes hurt people. They are ordinary mistakes.","points":["Power lines are the serious one. Assume every line is live. Do not pull a wire off a line. Call the power company.","If someone is being shocked, do not grab them. Turn the power off, or move the wire with something dry that is not metal.","A car battery, or a ring across its terminals, can burn you. A capacitor inside a power supply can shock you after the radio is unplugged.","Use the least power that works. FM stays on the whole time you transmit, so it counts more than a casual voice contact."],"part":"The station","check":{"prompt":"An antenna wire is touching a power line. What do you do?","choices":["Stay away and call the power company","Pull it off with your hands","Turn the radio's volume up so you can hear the line"],"answer":0,"why":"You do not touch it and you do not pull it. The line can kill you. The power company is who clears it."}},{"id":"pace","title":"How to use the book now","minutes":3,"lead":"The book is a warehouse. This class is the aisle. You walk one aisle.","points":["Pick the lesson you just finished. Find that same idea in the book. Read only those pages.","Then do a few quiz questions on that idea. A miss means “come back,” not “you cannot do this.”","The sheets are the card you glance at after the idea is familiar. They are a bad place to start.","Stop while the idea is still clear. Tomorrow's lesson will be here."],"part":"The station","check":{"prompt":"What should you read in the book after a lesson?","choices":["The pages about that one idea","The whole book, so you do not fall behind","Nothing ever again"],"answer":0,"why":"One idea in the class, the same idea in the book, a few questions, then stop. That is the whole method."}},{"id":"control","title":"Who is allowed to transmit","minutes":4,"lead":"A station does not transmit by itself. A licensed person is responsible for every transmission.","points":["That person is the control operator. The place where they control the radio is the control point.","The station may use only the frequencies and modes the control operator is allowed to use.","An unlicensed person, a child for example, may speak into the microphone if a control operator is right there and in charge.","You are responsible for what your station sends, even if someone else is holding the microphone."],"part":"The rules","check":{"prompt":"Who is responsible for the transmissions from an amateur station?","choices":["The control operator, and the station licensee","Only the person who bought the radio","The repeater, if you are using one"],"answer":0,"why":"The control operator runs the station. The licensee is also responsible. An unlicensed voice is allowed only while a control operator is present."}},{"id":"forbidden","title":"What you may not send","minutes":4,"lead":"Ham radio is not a broadcast station, a music service, or a private business line.","points":["No music. No broadcasting to the general public. No obscene language.","No secret codes meant to hide the meaning. Ordinary abbreviations and Q codes are fine. Control signals for a satellite are the rare exception.","You may not be paid to operate, and you may not use the radio to run a business. Selling a radio to another ham once in a while is allowed. Doing it regularly is not.","News gathering for a broadcast station is not a ham activity. Helping in a real emergency is."],"part":"The rules","check":{"prompt":"Which of these is allowed?","choices":["Telling another ham you have a used radio for sale, once","Playing music for people who are listening","Hiding a message in a private cipher"],"answer":0,"why":"An occasional notice that equipment is for sale is fine. Music, broadcasting, and codes that hide the meaning are not."}},{"id":"oneway","title":"One-way transmissions","minutes":3,"lead":"Most ham contacts are two people talking. A few one-way transmissions are still allowed.","points":["A beacon sends a short identification so people can see how far the band is open.","Telemetry is data about a station, such as a satellite reporting its health. Telecommand is a signal that controls a station.","Code practice and information bulletins for other hams are allowed. So is a real distress call.","A beacon is limited to 100 watts. It still has to identify."],"part":"The rules","check":{"prompt":"A beacon exists to…","choices":["Let people observe radio propagation","Play music down the band","Replace your call sign"],"answer":0,"why":"A beacon is a one-way signal used to see where the band is reaching. It must identify, and it may not run more than 100 watts."}},{"id":"term","title":"Ten years, then renew","minutes":3,"lead":"The license is good for 10 years. You renew it. You do not take the test again if you renew on time.","points":["After it expires you have a 2 year grace period to renew without retesting.","During that grace period you may not transmit. The license is not valid until it is renewed and shows in the FCC database.","There are three written license classes: Technician, General, and Amateur Extra. Morse code is not required for any of them.","A new Technician usually receives a call sign with two letters, a number, and three letters, like KD8XYZ. That example is not a real assignment."],"part":"The rules","check":{"prompt":"Your license expired last month. May you transmit while you renew it?","choices":["No","Yes, for two years","Yes, on 2 meters only"],"answer":0,"why":"The grace period lets you renew without a new exam. It does not let you transmit. Wait until the renewal is in the FCC database."}},{"id":"share","title":"Sharing a frequency","minutes":4,"lead":"You do not own a frequency. On some bands you are a guest of another service.","points":["Where amateurs are secondary, you must not interfere with the primary service, and you must accept their interference.","A band plan is a voluntary agreement about where different modes sit. It is good manners and good coordination. It is not the FCC rule.","If an FCC rule and a band plan disagree, you obey the FCC.","Repeater coordination is also voluntary. If two repeaters interfere, the coordinated one has priority."],"part":"The rules","check":{"prompt":"On a band where amateurs are secondary, you…","choices":["Must not interfere with the primary service","Have first rights because you have a license","May ignore the primary station if you were there first"],"answer":0,"why":"Secondary means you yield. A band plan is voluntary. The FCC rule is not."}},{"id":"power","title":"How much power","minutes":3,"lead":"Use the least power that makes the contact. There is also a ceiling.","points":["On most VHF and UHF bands the ceiling is 1500 watts peak envelope power. A handheld is a few watts. You will not be near 1500.","On the Technician HF frequencies, including 10 meter phone, the ceiling is 200 watts.","More power does not fix a bad antenna, and it is more likely to bother a neighbor.","In a real emergency, saving a life comes first. The normal frequency limits can yield to that. You still identify."],"part":"The rules","check":{"prompt":"The power you should use is…","choices":["The least that still completes the contact","Always the maximum your radio offers","200 watts on every band"],"answer":0,"why":"The rule is the minimum power necessary. 1500 watts is the usual ceiling, and 200 watts is the ceiling on the Technician HF segments."}},{"id":"idextra","title":"Identifying, the details","minutes":4,"lead":"You already know the 10 minute rule. The test asks a few sharper versions.","points":["The identification is in English. It is your call sign, spoken or sent clearly.","A tactical name like “rest stop” is fine at a public event if you also give your FCC call sign every 10 minutes.","A special-event call sign is a short 1 by 1. The station must also send the trustee’s own call sign at least once an hour.","At the end of a contact, you identify again, even if 10 minutes have not passed."],"part":"The rules","check":{"prompt":"A tactical name at a race is enough by itself.","choices":["No. Your FCC call sign is still required every 10 minutes","Yes, if net control knows you","Yes, if you said your name"],"answer":0,"why":"Tactical names are convenient. They do not replace the call sign. English, every 10 minutes, and at the end."}},{"id":"cq","title":"CQ, reports, and three Q codes","minutes":4,"lead":"A few old abbreviations are still the normal way to start and to describe a signal.","points":["CQ means you are calling anyone. On a repeater you usually just say your call sign. CQ is more at home on HF and on simplex.","A voice signal report is two numbers: readability from 1 to 5, and strength from 1 to 9. “Five nine” means easy to understand and strong.","QRM is interference from other stations. QRN is static and noise. QSY means change frequency.","You do not need a secret code book. These are just short, shared words."],"part":"Working a contact","check":{"prompt":"QRM means…","choices":["Interference from other stations","Change frequency","Static from a storm"],"answer":0,"why":"QRM is man-made interference. QRN is natural noise. QSY means move to another frequency."}},{"id":"modes","title":"FM, SSB, and how wide they are","minutes":5,"lead":"A mode is the way the voice rides on the wave. Wider modes take more room on the band.","points":["FM is what repeaters and handhelds use. It is about 10 to 15 kHz wide. The strongest signal wins, which is called the capture effect.","SSB is a narrow voice mode, about 3 kHz wide. It reaches farther for the same power. On 10 meters, VHF, and UHF, hams use upper sideband.","AM is about 6 kHz wide. The test’s name for Morse is CW, and it is the narrowest, about 150 Hz. You still do not need to learn the code.","Because SSB is narrower, it is the better choice for a weak signal. FM sounds cleaner when signals are strong."],"part":"Working a contact","check":{"prompt":"Which voice mode is narrowest?","choices":["SSB, about 3 kHz","FM, about 10 to 15 kHz","A mode that is 6 MHz wide"],"answer":0,"why":"SSB is about 3 kHz. FM is about 10 to 15 kHz. Fast-scan television is the very wide one, about 6 MHz. CW is narrower than all of these, and it is not required."}},{"id":"digital","title":"Digital voice, APRS, and satellites","minutes":5,"lead":"Some contacts are data, or a voice that has been turned into digits, or a repeater flying overhead.","points":["Packet, PSK31, and FT8 are digital modes. A computer sound card often makes the tones. You still identify with your call sign.","APRS is the Automatic Packet Reporting System. It sends a position, often on 144.390 MHz, so other people can see where a station is.","DMR puts two digital conversations on one repeater by taking turns in time slots. A color code is its version of a tone. D-STAR and System Fusion are other digital-voice systems.","A satellite hears your uplink and sends a downlink. Listen first. The frequency seems to drift as the satellite moves. That drift is Doppler."],"part":"Working a contact","check":{"prompt":"APRS is used to…","choices":["Report a station’s position","Replace the need for a license","Send music on 2 meters"],"answer":0,"why":"APRS beacons a position and short data, commonly on 144.390 MHz. A satellite contact needs an uplink, a downlink, and attention to Doppler."}},{"id":"links","title":"Radios tied together by the internet","minutes":3,"lead":"Some repeaters are connected to distant repeaters through the internet. Your license still matters.","points":["IRLP and EchoLink connect amateur stations over the internet. IRLP is usually a radio talking to a local node, using keypad tones.","EchoLink can be a computer or a phone. You still have to be a licensed amateur to transmit.","A gateway is the station that joins the radio side to the internet side.","What you say still has to follow the same rules. The internet does not make music, business, or a missing call sign legal."],"part":"Working a contact","check":{"prompt":"To transmit through EchoLink you need…","choices":["An amateur license","Only an email address","A Morse key"],"answer":0,"why":"Internet linking is still amateur radio. IRLP and EchoLink require a license, and the usual identification rules still apply."}},{"id":"sight","title":"Why VHF stops at the hill","minutes":4,"lead":"2 meters and 70 centimeters usually travel like light. They go until something is in the way.","points":["This is line of sight. A hill, a building, or the curve of the earth ends the contact.","The radio horizon is a little farther than the visual horizon, about 15 percent, because the air bends the wave slightly.","Height helps more than power. That is why the repeater is on the hill.","Leaves and buildings absorb some of the signal. A clear path is a better path."],"part":"How signals travel","check":{"prompt":"VHF and UHF signals normally…","choices":["Travel by line of sight","Bounce around the world all day","Only work indoors"],"answer":0,"why":"VHF and UHF are line-of-sight bands. Range grows when the antenna is higher. The radio horizon is a bit farther than what your eyes see."}},{"id":"sky","title":"The sky that brings HF back","minutes":4,"lead":"HF can reach past the horizon because a layer of the upper atmosphere bends it back to earth.","points":["That layer is the ionosphere. The bend is called skip, or skywave.","It changes with the time of day. Lower HF is often better at night. Higher HF is often better in the daytime.","The sun runs an 11 year cycle. More sunspots usually means the higher HF bands reach farther.","VHF almost always punches through the ionosphere instead of bouncing. That is why your handheld does not talk to other countries by itself."],"part":"How signals travel","check":{"prompt":"What lets an HF signal return to earth far away?","choices":["The ionosphere","A repeater on every hill","The rubber duck antenna"],"answer":0,"why":"The ionosphere refracts HF back down. More sunspots, on an 11 year cycle, usually help the higher HF bands."}},{"id":"oddpaths","title":"The surprise long paths","minutes":4,"lead":"Sometimes VHF goes much farther than the next hill. The test expects you to know the names.","points":["Sporadic E is a patchy layer that can carry 6 meters and even 2 meters hundreds of miles, often in summer.","A tropospheric duct is a weather layer that pipes VHF and UHF along, sometimes for a few hundred miles.","Knife-edge diffraction is the wave bending over a sharp ridge, so it is heard on the far side.","Picket fencing is the rapid flutter you hear in a moving car when the signal arrives by several paths at once."],"part":"How signals travel","check":{"prompt":"Rapid flutter while you are driving is called…","choices":["Picket fencing","Sporadic E","A band plan"],"answer":0,"why":"Picket fencing is mobile flutter from multipath. Sporadic E, ducting, and knife-edge diffraction are the long or over-the-ridge paths."}},{"id":"poles","title":"Hold the antenna the same way","minutes":3,"lead":"A signal has a direction to its electric field. Your antenna should match it.","points":["A vertical antenna makes a vertically polarized wave. Repeaters and handhelds use vertical.","Hold the handheld upright. Laying it down can drop the signal a great deal.","Many weak-signal stations on SSB use horizontal antennas. Matching still matters.","The test is not asking you to calculate the field. It is asking you to point the antenna the same way as the station you want."],"part":"How signals travel","check":{"prompt":"FM repeaters usually expect your antenna to be…","choices":["Vertical","Lying flat","Pointed at the ground"],"answer":0,"why":"Repeater antennas are vertical. Hold the handheld upright so your polarization matches."}},{"id":"ladder","title":"The thousand ladder","minutes":4,"lead":"The metric prefixes are nicknames for thousands, so a number can stay short.","points":["Kilo means thousand. Mega means million. Giga means billion.","Milli means thousandth. Micro means millionth. Nano means billionth. Pico means trillionth.","1,500 kHz is 1.5 MHz. 500 milliwatts is 0.5 watts. 3,500,000 Hz is 3.5 MHz.","There are 1,000 picofarads in a nanofarad, and 1,000 nanofarads in a microfarad. The Metrics lab will walk the ladder with you."],"part":"The numbers","check":{"prompt":"1,500 kHz is the same as…","choices":["1.5 MHz","1.5 Hz","1,500 MHz"],"answer":0,"why":"Kilo is thousand and mega is million, so you move three places. 1,500 kHz is 1.5 MHz."}},{"id":"ohm","title":"Ohm’s law","minutes":5,"lead":"Three letters. Cover the one you need. The picture is still push, flow, and squeeze.","points":["E is voltage in volts. I is current in amps. R is resistance in ohms.","E = I × R. The push equals the flow times the squeeze.","I = E ÷ R. A 12 volt battery across 4 ohms gives 3 amps.","R = E ÷ I. If 12 volts pushes 1.5 amps, the resistance is 8 ohms. The Ohm lab draws this."],"part":"The numbers","check":{"prompt":"12 volts across 4 ohms. How much current?","choices":["3 amps","48 amps","0.3 amps"],"answer":0,"why":"Current is voltage divided by resistance. 12 ÷ 4 = 3 amps."}},{"id":"watts","title":"Power","minutes":4,"lead":"Power is how fast the energy is used. The unit is the watt.","points":["P = E × I. Push times flow.","13.8 volts times 10 amps is 138 watts. That is a real radio-sized example.","If you know current and resistance, P = I × I × R. If you know voltage and resistance, P = E × E ÷ R.","You only need the first formula until the others show up in a question. The Power lab will multiply them for you."],"part":"The numbers","check":{"prompt":"13.8 volts and 10 amps. How much power?","choices":["138 watts","23.8 watts","1.38 watts"],"answer":0,"why":"Power is voltage times current. 13.8 × 10 = 138 watts."}},{"id":"storage","title":"Capacitors, coils, and impedance","minutes":4,"lead":"Two parts store energy. Impedance is the squeeze when the current is alternating.","points":["A capacitor stores energy in an electric field. The unit is the farad. A handheld will see microfarads or picofarads, never a whole farad.","An inductor, a coil, stores energy in a magnetic field. The unit is the henry.","Impedance is the opposition to AC, measured in ohms, like resistance. The letter is often Z.","Metals conduct because they have many free electrons. Glass, rubber, and ceramic are insulators."],"part":"The numbers","check":{"prompt":"A capacitor stores energy in…","choices":["An electric field","A magnetic field","The license database"],"answer":0,"why":"Capacitors store energy in an electric field, in farads. Inductors store it in a magnetic field, in henries."}},{"id":"parts","title":"Resistor, capacitor, coil","minutes":4,"lead":"These three show up on almost every schematic in the book.","points":["A resistor opposes current and turns some energy into heat. A potentiometer is a resistor you can turn.","A capacitor is two plates that store a charge. It can pass a changing current and block a steady one.","An inductor is a coil. It resists a change in current.","A transformer is two coils sharing a magnetic field. It changes voltage and can match impedance."],"part":"The parts","check":{"prompt":"A potentiometer is…","choices":["A variable resistor","A kind of antenna","A fuse"],"answer":0,"why":"A potentiometer is a resistor with a movable contact. A transformer is the pair of coils that changes voltage."}},{"id":"semis","title":"Diodes, transistors, relays","minutes":4,"lead":"These parts decide whether current goes, and how much.","points":["A diode lets current flow one way. The symbol is a triangle pointing at a bar. The bar is the cathode.","An LED is a diode that makes light. A rectifier diode turns AC into DC.","A transistor can amplify or switch. A bipolar transistor is controlled by current. A field-effect transistor is controlled by voltage.","A relay is a switch pulled in by an electromagnet, so a small current can turn on a big one."],"part":"The parts","check":{"prompt":"A diode is used to…","choices":["Let current pass in one direction","Store energy in a magnetic field","Identify your station"],"answer":0,"why":"A diode conducts one way. An LED lights. A rectifier makes DC from AC. A transistor amplifies or switches."}},{"id":"schematic","title":"Reading a schematic","minutes":4,"lead":"A schematic is a map of connections, not a picture of the parts.","points":["A zigzag is a resistor. Two parallel plates are a capacitor. A coil of loops is an inductor.","A diode is a triangle against a bar. A transistor has three leads, and an arrow on one of them.","A battery is a long line and a short line. The long line is positive. Ground is a set of lines like a rake, or a triangle.","A switch is a break you can close. A fuse is a thin link that opens when the current is too high. An antenna is a triangle or a set of branches."],"part":"The parts","check":{"prompt":"On a battery symbol, the long line is…","choices":["Positive","Always the fuse","The antenna"],"answer":0,"why":"The long line is positive and the short line is negative. A zigzag is a resistor. Two plates are a capacitor."}},{"id":"receiver","title":"What makes a receiver good","minutes":3,"lead":"Two words describe a receiver. You will see both on the test.","points":["Sensitivity is how weak a signal it can still hear.","Selectivity is how well it ignores stations on nearby frequencies.","An S meter shows how strong the received signal is. It does not show your transmit power.","A transceiver is a transmitter and a receiver in one box. Most ham radios are transceivers."],"part":"The station bench","check":{"prompt":"Selectivity means the receiver can…","choices":["Separate the station you want from one nearby","Run on 1500 watts","Measure resistance"],"answer":0,"why":"Selectivity rejects neighbors on the dial. Sensitivity hears weak signals. The S meter reports received strength."}},{"id":"bench","title":"Power, meters, and solder","minutes":4,"lead":"A few bench habits keep the radio, and you, out of trouble.","points":["Most mobile radios want about 13.8 volts DC. A regulator holds that voltage steady while the load changes.","A voltmeter goes across a part, in parallel. An ammeter goes in the path, in series. Measure resistance only with the power off.","Use rosin-core solder for electronics. Acid-core solder belongs nowhere near a radio. It eats the joint.","A dull, grainy joint is a bad solder joint. A good one is shiny and smooth."],"part":"The station bench","check":{"prompt":"Which solder is for radios?","choices":["Rosin core","Acid core","Either one"],"answer":0,"why":"Rosin core. Acid core corrodes electronics. Measure ohms with the power off, and feed a mobile radio about 13.8 volts."}},{"id":"swr","title":"SWR, a tuner, and a dummy load","minutes":4,"lead":"The radio wants to see a certain load, usually 50 ohms. SWR is how close you came.","points":["An SWR of 1 to 1 means a match. A high SWR means some power is reflected back. That can overheat the radio’s final amplifier.","Many radios protect themselves by reducing power when the SWR is high. The contact gets worse, which is the radio saving itself.","An antenna tuner matches the impedance at the radio. It does not make a bad antenna into a good one, but it lets the radio deliver power.","A dummy load is a shielded 50 ohm resistor. You transmit into it to test the radio without putting a signal on the air."],"part":"The station bench","check":{"prompt":"A dummy load is for…","choices":["Testing a transmitter without radiating","Raising the antenna","Measuring a battery’s license class"],"answer":0,"why":"A dummy load absorbs the power so you can test. An SWR of 1:1 is a match. A tuner makes the radio happy. It does not fix the antenna by itself."}},{"id":"coax","title":"The cable","minutes":4,"lead":"Coax is the hose between the radio and the antenna. It is not all the same.","points":["Most ham coax is 50 ohms. It has a center conductor, insulation, and a shield.","Loss turns power into heat in the cable. Loss grows as the frequency goes up, and as the cable gets longer.","Water inside coax raises the loss. Seal outdoor connectors. A wet cable can look fine and still be ruining the signal.","A handheld often uses an SMA connector. A mobile cable often uses a PL-259. Type N is sturdy and common at UHF."],"part":"The station bench","check":{"prompt":"Coax loss gets worse when…","choices":["The frequency is higher, or water gets in","You identify more often","The license is renewed"],"answer":0,"why":"Higher frequency, longer cable, and moisture all increase loss. Most ham feed line is 50 ohm coax."}},{"id":"rfi","title":"When the radio bothers someone","minutes":4,"lead":"Interference has a direction. The cure depends on who is hearing what.","points":["Harmonics are copies of your signal at 2 times, 3 times, the frequency. A low-pass filter at your transmitter reduces them.","Fundamental overload is different. Your real signal is so strong that a nearby radio or telephone cannot cope. A band-reject filter at the affected device, or less power, is the fix.","A snap-on ferrite on a cable blocks radio energy that is riding in on the wire.","A whine in the mobile speaker that rises with the engine is alternator noise. It comes in on the power leads."],"part":"The station bench","check":{"prompt":"A low-pass filter at the transmitter is used to reduce…","choices":["Harmonics","The need for a license","Alternator whine in a parked car"],"answer":0,"why":"Harmonics are your problem to filter, at your radio. Overload of a neighbor’s set is a different problem, usually fixed at their end or by using less power."}},{"id":"wires","title":"A dipole and a vertical","minutes":5,"lead":"Two antennas cover most of the test. Both are cut to a fraction of the wavelength.","points":["A half-wave dipole is fed in the middle. Each side is a quarter wave. Length in feet is about 468 divided by the frequency in MHz.","At 146 MHz, 468 ÷ 146 is about 3.2 feet. That is a 2 meter half-wave dipole.","A quarter-wave vertical is about 234 divided by the frequency in MHz. It needs radials or a car body as the other half.","A loading coil lets you use a shorter antenna. The coil makes it look longer electrically. A 5/8 wave vertical is a common, efficient mobile antenna."],"part":"Antennas","check":{"prompt":"The length of a half-wave dipole, in feet, is about…","choices":["468 divided by the frequency in MHz","468 times the frequency","234 times the band name"],"answer":0,"why":"Dipole feet ≈ 468 ÷ MHz. A quarter-wave vertical is about 234 ÷ MHz, and it needs a ground plane."}},{"id":"yagi","title":"A beam that points","minutes":4,"lead":"A Yagi puts more of your signal in one direction. The extra is taken from the other directions.","points":["The element connected to the cable is the driven element.","The reflector is a bit longer and sits behind it. The directors are a bit shorter and sit in front.","Gain does not create power. It concentrates it. Front-to-back ratio tells you how well it ignores what is behind it.","You point it at the station you want. That is also how a fox hunt finds a hidden transmitter."],"part":"Antennas","check":{"prompt":"On a Yagi, the reflector is…","choices":["A bit longer than the driven element, and behind it","The cable","Shorter, and in front"],"answer":0,"why":"The reflector is slightly longer and behind the driven element. Directors are slightly shorter and in front. Gain is concentrated power, not new power."}},{"id":"exposure","title":"RF exposure","minutes":4,"lead":"Your body can absorb radio energy. The rule is to know whether your station is within the limits.","points":["You must be able to show that people are not exposed to more RF than the FCC allows. Many small stations qualify for an exemption. If you do not, you evaluate.","A controlled area is you and your household, who know the station is there. An uncontrolled area is a neighbor or the sidewalk. The public limit is stricter.","FM and many digital modes stay on the whole time you transmit, so they count more than ordinary SSB voice. More power, more duty cycle, closer people, and more antenna gain all raise exposure.","If you change power, antenna, or how you operate, you check the evaluation again. A few watts on a handheld is rarely the problem. A beam pointed at a neighbor’s window can be."],"part":"Safety","check":{"prompt":"Which raises RF exposure the most, all else equal?","choices":["A mode that transmits continuously, at higher power, close to people","Saying your call sign more clearly","Using a dummy load in a shielded can"],"answer":0,"why":"Power, duty cycle, distance, frequency, and antenna gain decide exposure. Re-check when the station changes. The public limit is stricter than the one for your own household."}},{"id":"shop","title":"Lightning, batteries, towers, fuses","minutes":5,"lead":"The last safety lesson is the shop and the tower, not the math.","points":["Disconnect the antenna from the radio when a storm is close. Ground the mast to a ground rod, and bond that ground to the house electrical ground. Never use a gas pipe as a ground.","A lead-acid battery gives off hydrogen. Ventilate it, and keep sparks away. A short across the terminals can burn you. Take off metal rings.","The fuse for a mobile radio goes in the positive lead, close to the battery. Use the size the radio maker asks for. A bigger fuse is not safer.","The green wire in house wiring is the safety ground. On a tower, use a harness, do not climb alone, and stay off it in a storm or near a power line."],"part":"Safety","check":{"prompt":"Where does the fuse for a mobile radio go?","choices":["In the positive lead, close to the battery","In the antenna connector","It can be left out if the radio is new"],"answer":0,"why":"Fuse the positive lead near the battery, at the rated size. Vent a lead-acid battery. Bond grounds together. Climb a tower with a harness and a partner."}}];
      lessons = data;
      const saved = Number(localStorage.getItem(KEY));
      if (Number.isFinite(saved) && saved >= 0) {
        doneThrough = saved;
        index = Math.min(saved, lessons.length - 1);
      }
      let lastPart = "";
      lessons.forEach((lesson, itemIndex) => {
        if (lesson.part !== lastPart) {
          const label = document.createElement("p");
          label.className = "kicker";
          label.textContent = lesson.part;
          path.appendChild(label);
          lastPart = lesson.part;
        }
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = itemIndex + 1 + ". " + lesson.title;
        button.addEventListener("click", () => {
          path.hidden = true;
          go(itemIndex);
        });
        path.appendChild(button);
      });
      render();
    </script>
